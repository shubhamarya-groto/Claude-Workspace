<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>GFB Final CTA · demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@600&family=Inter:wght@400;500&display=swap">
<style>
body{margin:0;background:#fff}
.demo-note{font:13px/1.5 Inter,system-ui,sans-serif;color:#525C70;background:#FFF7F0;border-bottom:1px solid #F5D9C3;padding:10px 16px;text-align:center}
/* GFB Final CTA · Figma 1259:9109 (Home Page 1259:9027), "Elevate Card (variant 4) + custom CSS"
   Soft peach-to-pink gradient stands in for Figma's two background photos; an editor can set
   the real image in the Background image field. Gears are outlines, orange, very faint. */
.gfb-cta {
  --cta-ink: #111111;
  --cta-sub: rgba(0, 0, 0, 0.64);
  --cta-gear: #F16C0E;
  --cta-dark: #0A1612;
  --cta-font-display: var(--hsElevate--h2__font, "Instrument Sans"), system-ui, sans-serif;
  --cta-font-body: var(--hsElevate--body__font, "Inter"), system-ui, sans-serif;
  position: relative;
  overflow: hidden;
  isolation: isolate;
  color: var(--cta-ink);
  font-family: var(--cta-font-body);
  -webkit-font-smoothing: antialiased;
  background:
    radial-gradient(40% 90% at 100% 55%, rgba(236, 168, 170, 0.75), transparent 75%),
    radial-gradient(60% 70% at 15% 100%, rgba(255, 248, 236, 0.95), transparent 70%),
    radial-gradient(50% 60% at 55% 0%, rgba(250, 222, 206, 0.8), transparent 70%),
    linear-gradient(90deg, #FCF1E8 0%, #F8E2D8 60%, #F1CCC6 100%);
}
.gfb-cta--photo { background: var(--cta-bg) center / cover no-repeat, #FCF1E8; }
.gfb-cta, .gfb-cta *, .gfb-cta *::before, .gfb-cta *::after { box-sizing: border-box; }

/* Gears: centres and sizes from Figma (inner holes 104 and 73 across) */
.gfb-cta .gfb-cta__gear { position: absolute; z-index: -1; pointer-events: none; color: var(--cta-gear); opacity: 0.2; }
.gfb-cta .gfb-cta__gear svg { display: block; width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.5px; vector-effect: non-scaling-stroke; }
.gfb-cta .gfb-cta__gear svg path { vector-effect: non-scaling-stroke; }
.gfb-cta .gfb-cta__gear--tl { left: 96px;  top: -71px;    width: 270px; height: 270px; transform: rotate(8deg); }
.gfb-cta .gfb-cta__gear--l  { left: -29px; top: 97px;     width: 190px; height: 190px; transform: rotate(-14deg); }
.gfb-cta .gfb-cta__gear--br { right: 96px; bottom: -71px; width: 270px; height: 270px; transform: rotate(8deg); }
.gfb-cta .gfb-cta__gear--r  { right: -28px; bottom: 98px; width: 190px; height: 190px; transform: rotate(-14deg); }

/* Band: 120 top and bottom, 96 sides */
.gfb-cta .gfb-cta__inner { display: flex; justify-content: center; max-width: 1440px; margin: 0 auto; padding: 120px 96px; }

/* Frosted card: white 60%, white 16% border, radius 24, 56 / 64 padding, 20 gap */
.gfb-cta .gfb-cta__card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  width: 100%;
  max-width: 1163px;
  padding: 56px 64px;
  text-align: center;
  background: rgba(255, 255, 255, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 24px;
  -webkit-backdrop-filter: blur(24px);
  backdrop-filter: blur(24px);
}
.gfb-cta .gfb-cta__heading {
  margin: 0;
  text-wrap: balance;
  font-family: var(--cta-font-display);
  font-size: clamp(32px, 2.2vw + 16px, 48px);
  font-weight: 600;
  line-height: 1.1;
  letter-spacing: -0.5px;
  color: var(--cta-ink);
}
.gfb-cta .gfb-cta__subhead { margin: 0; max-width: 60ch; text-wrap: balance; font-size: 18px; line-height: 1.6; color: var(--cta-sub); }

/* Buttons: 12 extra above (32 from the subhead), 16 apart */
.gfb-cta .gfb-cta__buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; padding-top: 12px; }
.gfb-cta .gfb-cta__btn {
  display: inline-flex;
  align-items: center;
  height: 48px;
  padding: 4px;
  border-radius: 999px;
  font-family: var(--cta-font-body);
  font-size: 16px;
  font-weight: 500;
  line-height: 1;
  color: #FFFFFF;
  text-decoration: none;
  white-space: nowrap;
  transition: background-color 0.15s ease;
}
.gfb-cta .gfb-cta__btn-label { padding: 0 16px; }
.gfb-cta .gfb-cta__btn-disc {
  display: inline-grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.08);
}
.gfb-cta .gfb-cta__btn--primary { background: var(--hsElevate--button--primary__backgroundColor, #F16C0E); color: #FFFFFF; } /* white label (7 Oct; ~3:1, I-01) */
.gfb-cta .gfb-cta__btn--primary:hover,
.gfb-cta .gfb-cta__btn--primary:focus-visible { background: #EA580C; color: #FFFFFF; }
.gfb-cta .gfb-cta__btn--dark { background: var(--cta-dark); color: #FFFFFF; box-shadow: inset 0 0 0 1.5px #D9D9D9; }
.gfb-cta .gfb-cta__btn--dark:hover,
.gfb-cta .gfb-cta__btn--dark:focus-visible { background: #1E2A26; color: #FFFFFF; }
.gfb-cta .gfb-cta__btn:focus-visible { outline: 3px solid var(--cta-dark); outline-offset: 3px; }

/* Tablet: less padding. Phone: buttons full width, two gears only */
@media (max-width: 1023px) {
  .gfb-cta .gfb-cta__inner { padding: 96px 32px; }
  .gfb-cta .gfb-cta__card { padding: 48px 40px; }
}
@media (max-width: 767px) {
  .gfb-cta .gfb-cta__inner { padding: 64px 16px; }
  .gfb-cta .gfb-cta__card { padding: 40px 24px; }
  .gfb-cta .gfb-cta__buttons { flex-direction: column; align-self: stretch; }
  .gfb-cta .gfb-cta__btn { justify-content: space-between; }
  .gfb-cta .gfb-cta__subhead { font-size: 16px; }
  .gfb-cta .gfb-cta__gear--l, .gfb-cta .gfb-cta__gear--r { display: none; }
}
</style></head><body>
<p class="demo-note">GFB Final CTA demo. Exact Figma copy. The background is a CSS stand-in for Figma's photo; gears are redrawn.</p>

  <div class="gfb-cta__inner"><div class="gfb-cta__card">
    <h2 class="gfb-cta__heading">The right connection could change everything.</h2>

</section>
